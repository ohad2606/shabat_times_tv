<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מסך תצוגה — ממתין לעיצוב</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0b0d12; color: #e8ecf4;
    font-family: "Arial Hebrew", Arial, Helvetica, sans-serif;
  }
  .wrap {
    height: 100%;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
    -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    text-align: center;
  }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: #4ade80; margin-bottom: 32px;
    -webkit-animation: pulse 2s infinite; animation: pulse 2s infinite;
  }
  @-webkit-keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  h1 { font-size: 3.2vw; font-weight: 600; margin: 0 0 18px; letter-spacing: .5px; }
  p  { font-size: 1.5vw; margin: 0 0 10px; color: #96a0b5; }
  .url { margin-top: 42px; font-size: 1.4vw; color: #6b7689; direction: ltr; font-family: monospace; }
  .clock { margin-top: 14px; font-size: 1.3vw; color: #6b7689; direction: ltr; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="dot"></div>
    <h1>המסך מחובר</h1>
    <p>התשתית פעילה. הדף יתחלף אוטומטית ברגע שהעיצוב יעלה.</p>
    <div class="url" id="url"></div>
    <div class="clock" id="clock"></div>
  </div>
<script>
  document.getElementById('url').textContent = location.href;
  function tick() {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    document.getElementById('clock').textContent =
      p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
