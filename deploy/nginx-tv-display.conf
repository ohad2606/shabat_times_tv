# TV display page — served over plain HTTP on port 80.
# Content lives in /var/www/tv, published at http://<server-ip>/tv/

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/tv;

    access_log /var/log/nginx/tv-access.log;
    error_log  /var/log/nginx/tv-error.log;

    # Smart TVs often have no address bar — send the bare IP to the display.
    location = / { return 302 /tv/; }
    location = /tv { return 301 /tv/; }

    location /tv/ {
        alias /var/www/tv/;
        index index.html;
        try_files $uri $uri/ =404;

        # Never cache: a redeploy must show up on the next TV refresh.
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;

        # Inject the auto-reload client into whatever design is deployed.
        sub_filter_once on;
        sub_filter '</body>' '<script src="/_tv/reload.js" defer></script></body>';
    }

    # Fonts and the React runtime never change between deploys — let the TV
    # keep them so a refresh re-fetches only the page itself.
    location /tv/fonts/ {
        alias /var/www/tv/fonts/;
        add_header Cache-Control "public, max-age=2592000" always;
    }
    location /tv/vendor/ {
        alias /var/www/tv/vendor/;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Auto-reload client (served from disk, cached briefly).
    location = /_tv/reload.js {
        alias /var/www/tv/_reload.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    # Deploy marker the reload client polls.
    location = /_tv/version {
        alias /var/www/tv/_version.txt;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # image-slot looks for an editor sidecar that only exists inside Claude
    # Design. Answer it quietly instead of logging a 404 on every load.
    location = /tv/.image-slots.state.json { access_log off; return 204; }

    # The favicon request fires before the page's own <link icon> exists,
    # so answer it here instead of logging a 404 on every load.
    location = /favicon.ico { access_log off; return 204; }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
